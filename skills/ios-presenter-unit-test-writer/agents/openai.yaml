interface:
  display_name: "iOS Presenter Unit Test Writer"
  short_description: "Write deterministic XCTest unit tests for VIPER presenters"
  default_prompt: "Build mode. Use $ios-presenter-unit-test-writer to update presenter tests and persist file edits. If presenter and output path are provided, do not ask questions and do not output planning text. Do not call todolist/todowrite/skill, do not emit <function=...> tags, and fallback to bash if write fails."
